services:
  display-hub:
    image: ghcr.io/snadboy/display-hub:latest
    container_name: display-hub
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      RADAR_FRAMES: "12"
      RADAR_REFRESH_S: "600"    # RainViewer publishes a new frame every 10 min
      STATUS_REFRESH_S: "60"    # keep the outdoor reading fresh — this is why the
                                # status strip is served separately from the frames
    # Devices reach the hub by LAN IP (they can't join the tailnet); humans use the VIP.
    ports:
      - "8098:8080"
    volumes:
      - display-hub-cache:/cache
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=displays"
      - "docktail.service.port=8080"
      - "docktail.service.service-port=443"

volumes:
  display-hub-cache:
