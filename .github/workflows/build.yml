name: build

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same-repo ghcr.io pushes need no PAT — the automatic GITHUB_TOKEN is enough.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/amoled-radar:latest
            ghcr.io/${{ github.repository_owner }}/amoled-radar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
